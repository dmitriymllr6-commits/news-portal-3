{% extends 'base.html' %}

{% block title %}
Добавить новость
{% endblock %}

{% block content %}

<h1>Добавить новость</h1>

<form method="post">

    {% csrf_token %}

    {{ form.as_p }}

    <button type="submit"
            class="btn btn-primary">

        Сохранить

    </button>

</form>

{% if form.errors %}

<div class="alert alert-danger mt-3">

    Ошибка заполнения формы

</div>

{% endif %}

{% endblock %}
