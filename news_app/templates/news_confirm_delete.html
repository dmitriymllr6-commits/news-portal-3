{% extends 'base.html' %}

{% block content %}

<h2>Удалить новость?</h2>

<p>{{ news.title }}</p>

<form method="post">
    {% csrf_token %}

    <button class="btn btn-danger">Да удалить</button>

    <a href="{% url 'detail' news.id %}" class="btn btn-secondary">
        Отмена
    </a>

</form>

{% endblock %}
